name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      apple_required: ${{ steps.classify.outputs.apple_required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: classify
        name: Classify pull request
        run: |
          scripts/ci/classify-changes.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: "node npm:@fission-ai/openspec"
      - name: Run portable repository gates
        run: scripts/repo-doctor.sh --static

  apple:
    name: apple
    needs: classify
    if: ${{ needs.classify.outputs.apple_required == 'true' }}
    runs-on: macos-15
    steps:
      - name: Fail closed until Apple routing lands
        run: |
          echo "Apple-sensitive diff 必须等待 #9 的定向 build/test 路由，不能由 #8 假装验证成功。" >&2
          exit 1

  gate:
    name: gate
    needs: [classify, static, apple]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Evaluate required gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          APPLE_REQUIRED: ${{ needs.classify.outputs.apple_required }}
          STATIC_RESULT: ${{ needs.static.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
        run: |
          scripts/ci/evaluate-gate.sh \
            "$CLASSIFY_RESULT" "$APPLE_REQUIRED" \
            "$STATIC_RESULT" "$APPLE_RESULT"
