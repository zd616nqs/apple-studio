name: light-change
version: 1
description: Single-App reversible behavior workflow - specs only
artifacts:
  - id: specs
    generates: "specs/**/*.md"
    description: Observable behavior delta for the affected capability
    template: spec.md
    instruction: |
      Create one delta spec per capability whose observable behavior changes.
      This schema is only for a single App change that is reversible and has no
      shared-layer, migration, privacy, security, or irreversible impact.

      Preserve the exact path of an existing capability. New path segments use
      kebab-case. Use ADDED, MODIFIED, REMOVED, or RENAMED Requirements; include
      the complete requirement when modifying it. Every requirement has at least
      one four-hash Scenario with WHEN and THEN bullets. A new capability starts
      with a Purpose of at least 50 characters.

      Specs state behavior, inputs, outputs, errors, and external constraints.
      Do not include implementation types, libraries, or task lists.
    requires: []

apply:
  requires: [specs]
  instruction: |
    Read the repository GOVERNANCE.md, the App context, project declaration, and
    this change's specs. Follow CONV-TEST-FIRST: observe the expected failing
    behavior test before implementation and do not rewrite a confirmed assertion
    unless the spec changes first. Implement only the declared delta, run the
    GATE-REQUIRED-VERIFICATION checks, validate the change, and report rollback
    readiness before archive. This workflow intentionally has no tasks artifact.
